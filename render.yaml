
services:
  - type: web
    name: pactpay
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: pactpay-db
          property: connectionString
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_TIMEOUT_MS
        value: "12000"
      - key: MODEL_API_KEY        # Meta Model API key (Muse Spark, Muse Voice Transcribe)
        sync: false
      - key: META_MODEL
        value: muse-spark-1.3
      - key: BASETEN_API_KEY      # optional: Muse Spark Open (open weights) via Baseten
        sync: false
      - key: BASETEN_MODEL
        value: meta-models/muse-spark-open
      - key: PACTPAY_REQUIRE_LOGIN
        value: "0"
      - key: PACTPAY_DEMO_USERNAME
        value: judge
      - key: PACTPAY_DEMO_PASSWORD
        sync: false   # enter PactPay-Judge-2026 (the pair listed in the README) or your own
      - key: PACTPAY_SHOW_DEMO_CREDENTIALS
        value: "1"   # shows the judge login on /login and /judges. The account only holds Sandbox test data.
      # Optional: PayPal Sandbox BUYER test login, shown on the /judges page. These are baked in at build time, so set them
      # before the build (a fake sandbox account only, never a real PayPal login).
      - key: NEXT_PUBLIC_SANDBOX_BUYER_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SANDBOX_BUYER_PASSWORD
        sync: false
      # NEXT_PUBLIC_APP_URL is optional on Render: the app falls back to RENDER_EXTERNAL_URL.
databases:
  - name: pactpay-db
    plan: free
    region: oregon
