<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 940" width="1800" height="940"><defs><marker id="a-0f1b17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1b17"/></marker><marker id="a-0866FF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0866FF"/></marker></defs><rect width="1800" height="940" fill="#f7f5ef"/><text x="60" y="70" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1b17" text-anchor="start">Discovery and evidence: facts are sourced, labelled, and never trusted blindly</text><text x="60" y="104" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#55635d" text-anchor="start">A browser can't change what is evaluated. Unknown stays unknown until a source says otherwise.</text><rect x="40" y="160" width="270" height="130" rx="14" fill="#fff1d6" stroke="#b86e00" stroke-width="1.5"/><text x="175" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Channel3 search</text><text x="175" y="216" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">real products + offers</text><text x="175" y="237" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">across real merchants</text><rect x="350" y="160" width="270" height="130" rx="14" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/><text x="485" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Server snapshot</text><text x="485" y="216" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">exact offer stored in Postgres</text><text x="485" y="237" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">UI gets an opaque UUID (ADR-007)</text><rect x="660" y="160" width="270" height="130" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="1.5"/><text x="795" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Policy evaluation</text><text x="795" y="216" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">PASS / FAIL / UNKNOWN</text><text x="795" y="237" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">per rule, from the snapshot</text><rect x="970" y="160" width="270" height="130" rx="14" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/><text x="1105" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Shortlist + ranking</text><text x="1105" y="216" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">final-total estimate</text><text x="1105" y="237" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">cheapest passing offer first</text><rect x="1280" y="160" width="270" height="130" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="1.5"/><text x="1415" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Hold → gate</text><text x="1415" y="216" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">re-fetch at settlement</text><text x="1415" y="237" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">(ADR-008 product detail)</text><path d="M310,225 L350,225" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M620,225 L660,225" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M930,225 L970,225" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M1240,225 L1280,225" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="40" y="350" width="1150" height="300" rx="22" fill="#fff" stroke="#cfd8d3" stroke-width="2" stroke-dasharray="8 6"/><text x="62" y="382" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#55635d" text-anchor="start" letter-spacing="1.5">EVIDENCE: what the catalog cannot say (shipping, final total, returns, delivery)</text><rect x="70" y="395" width="340" height="130" rx="14" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/><text x="240" y="425" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Claim intake</text><text x="240" y="451" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">source HTTPS URL on the</text><text x="240" y="472" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">merchant's own domain</text><rect x="430" y="395" width="340" height="130" rx="14" fill="#fff1d6" stroke="#b86e00" stroke-width="1.5"/><text x="600" y="425" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Human review (ADR-009)</text><text x="600" y="451" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">only HUMAN_REVIEWED claims</text><text x="600" y="472" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">reach the evaluator</text><rect x="790" y="395" width="370" height="130" rx="14" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/><text x="975" y="425" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Freshness + conflicts</text><text x="975" y="451" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">field-specific TTLs</text><text x="975" y="472" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">conflicting claims stay conflicts</text><path d="M410,460 L430,460" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M770,460 L790,460" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><text x="615" y="600" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#c0392b" text-anchor="middle">Missing, stale or conflicting evidence = UNKNOWN = not allowed to capture</text><rect x="1230" y="350" width="530" height="300" rx="22" fill="#e6efff" stroke="#0866FF" stroke-width="2" stroke-dasharray="8 6"/><text x="1252" y="382" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0866FF" text-anchor="start" letter-spacing="1.5">MUSE SELLER-TEXT READER</text><text x="1260" y="430" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="start">Muse Spark extracts only facts it can</text><text x="1260" y="456" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="start">quote word for word from a listing.</text><text x="1260" y="482" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="start">Labelled “seller-stated, not verified”.</text><text x="1260" y="508" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="start">A live prompt-injection test shows</text><text x="1260" y="534" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="start">hostile text staying inert.</text><path d="M1190,500 L1230,500" stroke="#0866FF" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#a-0866FF)"/><rect x="40" y="690" width="1720" height="210" rx="20" fill="#fff" stroke="#cfd8d3" stroke-width="1.5"/><text x="70" y="730" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#55635d" text-anchor="start" letter-spacing="1.5">OBSERVABILITY</text><rect x="70" y="755" width="395" height="120" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="90" y="800" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Decision receipts</text><text x="90" y="832" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="start">PASS / FAIL / UNKNOWN per rule</text><rect x="495" y="755" width="395" height="120" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="515" y="800" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Hash-chained audit</text><text x="515" y="832" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="start">tamper-evident event ledger</text><rect x="920" y="755" width="395" height="120" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="940" y="800" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Drift watch + report</text><text x="940" y="832" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="start">catalog drift, published with window + size</text><rect x="1345" y="755" width="395" height="120" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="1365" y="800" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Control center</text><text x="1365" y="832" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="start">AG Grid activity, filters, export</text></svg>