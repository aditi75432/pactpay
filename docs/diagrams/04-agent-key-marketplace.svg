<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960" width="1800" height="960"><defs><marker id="a-0f1b17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1b17"/></marker></defs><rect width="1800" height="960" fill="#f7f5ef"/><text x="60" y="70" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1b17" text-anchor="start">Bring your own agent: the key, the gateway, the limits</text><text x="60" y="104" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#55635d" text-anchor="start">Any agent (Muse, Claude Desktop, Cursor, your own code) can shop. None can change the rules or release money alone.</text><rect x="40" y="150" width="300" height="130" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="1.5"/><text x="190" y="180" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">1 · Shopper approves rules</text><text x="190" y="206" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">rules hashed + locked</text><text x="190" y="227" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">autonomy: ask every time /</text><text x="190" y="248" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">ask above a limit</text><rect x="400" y="150" width="300" height="130" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="1.5"/><text x="550" y="180" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">2 · Create an agent key</text><text x="550" y="206" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">ppk_… shown once</text><text x="550" y="227" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">SHA-256 stored · 24 h · revocable</text><text x="550" y="248" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">bound to one approval</text><rect x="760" y="150" width="340" height="130" rx="14" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/><text x="930" y="180" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">3 · Agent connects</text><text x="930" y="206" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">MCP server (scripts/mcp-server.mjs)</text><text x="930" y="227" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">HTTP /api/agent/v1/*</text><text x="930" y="248" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">Muse CLI: pnpm agent:muse</text><path d="M340,215 L400,215" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M700,215 L760,215" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="40" y="330" width="1060" height="290" rx="22" fill="#e4f3ea" stroke="#1f7a52" stroke-width="2" stroke-dasharray="8 6"/><text x="62" y="362" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1f7a52" text-anchor="start" letter-spacing="1.5">PACTPAY AGENT GATEWAY  (the only tools an agent has)</text><rect x="65" y="385" width="185" height="90" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="157" y="423" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1b17" text-anchor="middle">get_rules</text><text x="157" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#55635d" text-anchor="middle">read-only</text><rect x="265" y="385" width="185" height="90" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="357" y="423" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1b17" text-anchor="middle">shortlist</text><text x="357" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#55635d" text-anchor="middle">live offers ranked</text><rect x="465" y="385" width="185" height="90" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="557" y="423" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1b17" text-anchor="middle">hold_payment</text><text x="557" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#55635d" text-anchor="middle">PayPal authorize</text><rect x="665" y="385" width="185" height="90" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="757" y="423" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1b17" text-anchor="middle">request_settlement</text><text x="757" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#55635d" text-anchor="middle">gate decides</text><rect x="865" y="385" width="185" height="90" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="957" y="423" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#0f1b17" text-anchor="middle">order_status</text><text x="957" y="450" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="500" fill="#55635d" text-anchor="middle">own orders only</text><text x="570" y="520" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="middle">Every call is authenticated, rate-limited, scoped to the key's owner, and always acts as the agent (never as the user).</text><text x="570" y="555" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#1f7a52" text-anchor="middle">A person still approves each new hold on PayPal.</text><path d="M930,280 L930,330" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="1150" y="150" width="610" height="470" rx="14" fill="#fde8e5" stroke="#c0392b" stroke-width="1.5"/><text x="1455" y="180" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#c0392b" text-anchor="middle">What the server refuses (tested by pnpm agent:redteam)</text><rect x="1175" y="215" width="560" height="50" rx="14" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="1195" y="247" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#0f1b17" text-anchor="start">No key / fake / expired / revoked key</text><text x="1715" y="247" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#c0392b" text-anchor="end">401</text><rect x="1175" y="277" width="560" height="50" rx="14" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="1195" y="309" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#0f1b17" text-anchor="start">Edit rules or raise own autonomy</text><text x="1715" y="309" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#c0392b" text-anchor="end">no endpoint</text><rect x="1175" y="339" width="560" height="50" rx="14" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="1195" y="371" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#0f1b17" text-anchor="start">Settle above the limit or on “Ask every time”</text><text x="1715" y="371" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#c0392b" text-anchor="end">403 requiresHuman</text><rect x="1175" y="401" width="560" height="50" rx="14" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="1195" y="433" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#0f1b17" text-anchor="start">Hold an offer that already failed</text><text x="1715" y="433" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#c0392b" text-anchor="end">409</text><rect x="1175" y="463" width="560" height="50" rx="14" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="1195" y="495" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#0f1b17" text-anchor="start">Touch another user's order</text><text x="1715" y="495" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#c0392b" text-anchor="end">404</text><rect x="1175" y="525" width="560" height="50" rx="14" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="1195" y="557" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#0f1b17" text-anchor="start">Talk the gate into a capture</text><text x="1715" y="557" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="800" fill="#c0392b" text-anchor="end">not possible</text><rect x="40" y="660" width="1720" height="260" rx="20" fill="#fff" stroke="#cfd8d3" stroke-width="1.5"/><text x="70" y="700" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#55635d" text-anchor="start" letter-spacing="1.5">WHO USES THIS</text><rect x="70" y="725" width="395" height="160" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="90" y="770" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">AI assistant platforms</text><text x="90" y="802" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">let agents transact, and prove they</text><text x="90" y="824" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">stayed in bounds</text><rect x="495" y="725" width="395" height="160" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="515" y="770" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Marketplaces</text><text x="515" y="802" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">a control point between agent orders</text><text x="515" y="824" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">and capture</text><rect x="920" y="725" width="395" height="160" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="940" y="770" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Procurement tools</text><text x="940" y="802" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">limits per approval, audit trail per</text><text x="940" y="824" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">order</text><rect x="1345" y="725" width="395" height="160" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="1365" y="770" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Developers</text><text x="1365" y="802" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">a worked example of</text><text x="1365" y="824" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">authorize-then-capture + MCP</text></svg>