
services:
  - type: web
    name: pactpay
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: pactpay-db
          property: connectionString
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: MODEL_API_KEY        # Meta Model API key (Muse Spark, Muse Voice Transcribe)
        sync: false
      - key: META_MODEL
        value: muse-spark-1.3
      - key: BASETEN_API_KEY      # optional: Muse Spark Open (open weights) via Baseten
        sync: false
      - key: BASETEN_MODEL
        value: meta-models/muse-spark-open-1026
      - key: PACTPAY_REQUIRE_LOGIN
        value: "0"
      - key: PACTPAY_DEMO_USERNAME
        value: judge
      - key: PACTPAY_DEMO_PASSWORD
        sync: false   # enter PactPay-Judge-2026 (the pair listed in the README) or your own
      - key: PACTPAY_SHOW_DEMO_CREDENTIALS
        value: "0"
      # NEXT_PUBLIC_APP_URL is optional on Render: the app falls back to RENDER_EXTERNAL_URL.
databases:
  - name: pactpay-db
    plan: free
    region: oregon
