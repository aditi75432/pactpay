0" fill="#55635d" text-anchor="middle">within budget / hidden fee / currency?</text><text x="940" y="289" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="middle">text aimed at an AI (both readers)?</text><path d="M680,200 L740,240" stroke="#0866FF" stroke-width="2.5" fill="none" marker-end="url(#a-0866FF)"/><path d="M680,320 L740,310" stroke="#0866FF" stroke-width="2.5" fill="none" marker-end="url(#a-0866FF)"/><rect x="1200" y="140" width="260" height="90" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="1.5"/><text x="1330" y="170" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#1f7a52" text-anchor="middle">SAFE_TO_PAY</text><rect x="1200" y="250" width="260" height="90" rx="14" fill="#fde8e5" stroke="#c0392b" stroke-width="1.5"/><text x="1330" y="280" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#c0392b" text-anchor="middle">DO_NOT_PAY</text><rect x="1200" y="360" width="260" height="90" rx="14" fill="#fff1d6" stroke="#b86e00" stroke-width="1.5"/><text x="1330" y="390" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#b86e00" text-anchor="middle">CANNOT_VERIFY</text><path d="M1140,240 L1200,185" stroke="#1f7a52" stroke-width="2.5" fill="none" marker-end="url(#a-1f7a52)"/><path d="M1140,270 L1200,295" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#a-c0392b)"/><path d="M1140,300 L1200,405" stroke="#b86e00" stroke-width="2.5" fill="none" marker-end="url(#a-b86e00)"/><rect x="1520" y="220" width="240" height="150" rx="14" fill="#ffffff" stroke="#0e1a33" stroke-width="1.5"/><text x="1640" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Attached to the order</text><text x="1640" y="276" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">stored per transaction;</text><text x="1640" y="297" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">the settlement gate reads</text><text x="1640" y="318" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">the latest verdict</text><path d="M1460,295 L1520,295" stroke="#0e1a33" stroke-width="2.5" fill="none" marker-end="url(#a-0e1a33)"/><path d="M1460,185 L1490,185 L1490,270 L1520,270" stroke="#0e1a33" stroke-width="2.5" fill="none" marker-end="url(#a-0e1a33)"/><path d="M1460,405 L1490,405 L1490,320 L1520,320" stroke="#0e1a33" stroke-width="2.5" fill="none" marker-end="url(#a-0e1a33)"/><rect x="40" y="500" width="1720" height="270" rx="20" fill="#fff" stroke="#cfd8d3" stroke-width="1.5"/><text x="70" y="540" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#55635d" text-anchor="start" letter-spacing="1.5">FAIL-CLOSED BY DESIGN</text><rect x="70" y="565" width="540" height="78" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="90" y="599" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f1b17" text-anchor="start">Unreadable page</text><text x="90" y="626" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#b86e00" text-anchor="start">→ CANNOT_VERIFY</text><rect x="640" y="565" width="540" height="78" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="660" y="599" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f1b17" text-anchor="start">Readers disagree on any number</text><text x="660" y="626" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#b86e00" text-anchor="start">→ CANNOT_VERIFY</text><rect x="1210" y="565" width="540" height="78" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="1230" y="599" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f1b17" text-anchor="start">Lines don't add up to the total</text><text x="1230" y="626" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#c0392b" text-anchor="start">→ DO_NOT_PAY (hidden fee)</text><rect x="70" y="660" width="540" height="78" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="90" y="694" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f1b17" text-anchor="start">Instruction aimed at an AI in either reading</text><text x="90" y="721" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#c0392b" text-anchor="start">→ DO_NOT_PAY</text><rect x="640" y="660" width="540" height="78" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="660" y="694" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f1b17" text-anchor="start">Missing shipping / tax / total</text><text x="660" y="721" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#b86e00" text-anchor="start">→ CANNOT_VERIFY</text><rect x="1210" y="660" width="540" height="78" rx="14" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="1230" y="694" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f1b17" text-anchor="start">Not a checkout page</text><text x="1230" y="721" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#b86e00" text-anchor="start">→ CANNOT_VERIFY</text></svg>