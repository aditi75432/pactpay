# Render Blueprint for PactPay. In Render: New > Blueprint > pick this repository.
# Free plans spin down when idle and the free database expires after 30 days, so use paid plans for a
# judging window that outlasts that, or redeploy before judging.
services:
  - type: web
    name: pactpay
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: pactpay-db
          property: connectionString
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # NEXT_PUBLIC_APP_URL is optional on Render: the app falls back to RENDER_EXTERNAL_URL.
databases:
  - name: pactpay-db
    plan: free
    region: oregon
