<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" width="1800" height="760"><defs><marker id="a-0f1b17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1b17"/></marker></defs><rect width="1800" height="760" fill="#f7f5ef"/><text x="60" y="70" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1b17" text-anchor="start">One workflow: from a sentence to a safe payment</text><text x="60" y="104" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#55635d" text-anchor="start">Starts on Shop, continues on Agent, PayPal and Order. Each step shows who acts: Muse, you, or fixed code.</text><rect x="40" y="170" width="226" height="210" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="2.5"/><text x="153" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#0866FF" text-anchor="middle">1 · Say it</text><text x="153" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">Voice or text</text><rect x="54" y="320" width="198" height="44" rx="10" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="153" y="340" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0866FF" text-anchor="middle">Muse Voice Transcribe</text><path d="M268,275 L286,275" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="288" y="170" width="226" height="210" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="2.5"/><text x="401" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#0866FF" text-anchor="middle">2 · Rules</text><text x="401" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">You review and</text><text x="401" y="272" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">approve</text><rect x="302" y="320" width="198" height="44" rx="10" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="401" y="340" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0866FF" text-anchor="middle">Muse Spark drafts · you</text><text x="401" y="355" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0866FF" text-anchor="middle">lock</text><path d="M516,275 L534,275" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="536" y="170" width="226" height="210" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="2.5"/><text x="649" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#0866FF" text-anchor="middle">3 · Agent shops</text><text x="649" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">Tool-calling loop,</text><text x="649" y="272" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">live</text><rect x="550" y="320" width="198" height="44" rx="10" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="649" y="340" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0866FF" text-anchor="middle">Muse Spark picks the tools</text><path d="M764,275 L782,275" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="784" y="170" width="226" height="210" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="2.5"/><text x="897" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f7a52" text-anchor="middle">4 · PayPal hold</text><text x="897" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">Authorize, don't</text><text x="897" y="272" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">capture</text><rect x="798" y="320" width="198" height="44" rx="10" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="897" y="340" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f7a52" text-anchor="middle">Fixed gateway tools</text><path d="M1012,275 L1030,275" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="1032" y="170" width="226" height="210" rx="14" fill="#fff1d6" stroke="#b86e00" stroke-width="2.5"/><text x="1145" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#b86e00" text-anchor="middle">5 · You approve</text><text x="1145" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">On PayPal Sandbox</text><rect x="1046" y="320" width="198" height="44" rx="10" fill="#fff" stroke="#b86e00" stroke-width="1.5"/><text x="1145" y="340" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b86e00" text-anchor="middle">A person, always</text><path d="M1260,275 L1278,275" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="1280" y="170" width="226" height="210" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="2.5"/><text x="1393" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#0866FF" text-anchor="middle">6 · Inspect checkout</text><text x="1393" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">Two readings of the</text><text x="1393" y="272" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">page</text><rect x="1294" y="320" width="198" height="44" rx="10" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="1393" y="340" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0866FF" text-anchor="middle">Muse Spark + Muse Spark</text><text x="1393" y="355" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0866FF" text-anchor="middle">Open</text><path d="M1508,275 L1526,275" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="1528" y="170" width="226" height="210" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="2.5"/><text x="1641" y="210" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f7a52" text-anchor="middle">7 · Gate decides</text><text x="1641" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">Capture once, or</text><text x="1641" y="272" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#0f1b17" text-anchor="middle">void</text><rect x="1542" y="320" width="198" height="44" rx="10" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1641" y="340" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f7a52" text-anchor="middle">Fixed code, no model</text><rect x="40" y="430" width="1720" height="140" rx="20" fill="#fff" stroke="#cfd8d3" stroke-width="1.5"/><text x="70" y="470" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#55635d" text-anchor="start" letter-spacing="1.5">WHAT YOU SEE ALONG THE WAY</text><rect x="70" y="490" width="320" height="56" rx="10" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="230" y="514" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#0f1b17" text-anchor="middle">Live agent log: every tool call</text><rect x="410" y="490" width="320" height="56" rx="10" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="570" y="514" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#0f1b17" text-anchor="middle">The checkout page Muse is reading</text><rect x="750" y="490" width="320" height="56" rx="10" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="910" y="514" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#0f1b17" text-anchor="middle">Verdict + rule-by-rule receipt</text><rect x="1090" y="490" width="320" height="56" rx="10" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="1250" y="514" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#0f1b17" text-anchor="middle">Which Meta models read it</text><rect x="1430" y="490" width="320" height="56" rx="10" fill="#f7f5ef" stroke="#cfd8d3" stroke-width="1.5"/><text x="1590" y="514" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#0f1b17" text-anchor="middle">Blocked or paid, with the reason</text><rect x="40" y="600" width="1720" height="120" rx="20" fill="#fde8e5" stroke="#c0392b" stroke-width="1.5"/><text x="900" y="645" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#c0392b" text-anchor="middle">If the inspection says Do not pay or Can't verify, the gate blocks the capture and voids the hold.</text><text x="900" y="685" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="500" fill="#0f1b17" text-anchor="middle">Nothing moves without you, and nothing moves if the checkout isn't what you approved.</text></svg>