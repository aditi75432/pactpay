<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" width="1800" height="900"><defs><marker id="a-0866FF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0866FF"/></marker><marker id="a-1f7a52" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker></defs><rect width="1800" height="900" fill="#f7f5ef"/><text x="60" y="70" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1b17" text-anchor="start">The trust boundary: Muse proposes, fixed code disposes</text><text x="60" y="104" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#55635d" text-anchor="start">If the model is fooled, confused or wrong, the worst case is a request the gate refuses.</text><rect x="40" y="140" width="800" height="690" rx="22" fill="#e6efff" stroke="#0866FF" stroke-width="2" stroke-dasharray="8 6"/><text x="62" y="172" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0866FF" text-anchor="start" letter-spacing="1.5">PROBABILISTIC · META MUSE</text><rect x="960" y="140" width="800" height="690" rx="22" fill="#e4f3ea" stroke="#1f7a52" stroke-width="2" stroke-dasharray="8 6"/><text x="982" y="172" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1f7a52" text-anchor="start" letter-spacing="1.5">DETERMINISTIC · FIXED CODE</text><rect x="80" y="195" width="720" height="78" rx="14" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="110" y="231" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0866FF" text-anchor="start">Hears</text><text x="110" y="257" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">your request (Voice Transcribe)</text><rect x="80" y="295" width="720" height="78" rx="14" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="110" y="331" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0866FF" text-anchor="start">Drafts</text><text x="110" y="357" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">rules for you to review (json_schema)</text><rect x="80" y="395" width="720" height="78" rx="14" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="110" y="431" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0866FF" text-anchor="start">Chooses</text><text x="110" y="457" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">which tool to call next (tool-calling)</text><rect x="80" y="495" width="720" height="78" rx="14" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="110" y="531" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0866FF" text-anchor="start">Reads</text><text x="110" y="557" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">a checkout screenshot, twice (vision)</text><rect x="80" y="595" width="720" height="78" rx="14" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="110" y="631" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0866FF" text-anchor="start">Quotes</text><text x="110" y="657" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">seller facts, labelled unverified</text><rect x="80" y="695" width="720" height="78" rx="14" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="110" y="731" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0866FF" text-anchor="start">Explains</text><text x="110" y="757" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">the outcome in plain English</text><rect x="1000" y="195" width="720" height="78" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1030" y="231" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f7a52" text-anchor="start">Locks</text><text x="1030" y="257" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">the rules you approved (hashed)</text><rect x="1000" y="295" width="720" height="78" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1030" y="331" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f7a52" text-anchor="start">Compares</text><text x="1030" y="357" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">every number to those rules</text><rect x="1000" y="395" width="720" height="78" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1030" y="431" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f7a52" text-anchor="start">Adds up</text><text x="1030" y="457" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">itemized charges vs the stated total</text><rect x="1000" y="495" width="720" height="78" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1030" y="531" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f7a52" text-anchor="start">Scans</text><text x="1030" y="557" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">page text for instructions aimed at an AI</text><rect x="1000" y="595" width="720" height="78" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1030" y="631" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f7a52" text-anchor="start">Re-checks</text><text x="1030" y="657" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">the live offer and live PayPal hold</text><rect x="1000" y="695" width="720" height="78" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1030" y="731" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f7a52" text-anchor="start">Decides</text><text x="1030" y="757" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#55635d" text-anchor="start">capture once, or void. Unknown = no</text><rect x="845" y="330" width="110" height="250" rx="20" fill="#0e1a33" stroke="#0e1a33" stroke-width="1.5"/><text x="900" y="390" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">NO</text><text x="900" y="416" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">MODEL</text><text x="900" y="442" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">HAS</text><text x="900" y="468" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">AUTHORITY</text><path d="M810,455 L845,455" stroke="#0866FF" stroke-width="2.5" fill="none" marker-end="url(#a-0866FF)"/><path d="M955,455 L990,455" stroke="#1f7a52" stroke-width="2.5" fill="none" marker-end="url(#a-1f7a52)"/><text x="900" y="860" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f1b17" text-anchor="middle">Only the gateway tools exist: no tool edits rules, raises a limit or releases money (ADR-002).</text></svg>