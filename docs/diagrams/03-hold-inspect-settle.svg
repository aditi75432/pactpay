<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" width="1800" height="980"><defs><marker id="a-0f1b17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1b17"/></marker><marker id="a-1f7a52" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a52"/></marker><marker id="a-c0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="a-b86e00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker></defs><rect width="1800" height="980" fill="#f7f5ef"/><text x="60" y="70" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f1b17" text-anchor="start">Hold, inspect, settle: how money moves (and when it doesn't)</text><text x="60" y="104" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#55635d" text-anchor="start">Authorize first, capture later (ADR-001). The inspection verdict feeds the same gate that decides capture.</text><rect x="40" y="190" width="250" height="120" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="1.5"/><text x="165" y="220" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">1 · Rules approved</text><text x="165" y="246" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">Muse drafts, you edit,</text><text x="165" y="267" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">server hashes + locks</text><rect x="340" y="190" width="250" height="120" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="1.5"/><text x="465" y="220" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">2 · Agent shortlists</text><text x="465" y="246" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">live offers ranked against</text><text x="465" y="267" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">the locked rules</text><rect x="640" y="190" width="250" height="120" rx="14" fill="#fff1d6" stroke="#b86e00" stroke-width="1.5"/><text x="765" y="220" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">3 · PayPal HOLD</text><text x="765" y="246" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">order intent=AUTHORIZE</text><text x="765" y="267" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">you approve on PayPal</text><rect x="940" y="190" width="250" height="120" rx="14" fill="#e6efff" stroke="#0866FF" stroke-width="1.5"/><text x="1065" y="220" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">4 · Inspect checkout</text><text x="1065" y="246" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">Muse reads the page twice</text><text x="1065" y="267" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">(optional, attaches to order)</text><rect x="1240" y="190" width="250" height="120" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="3"/><text x="1365" y="220" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">5 · Settlement gate</text><text x="1365" y="246" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">fixed code · re-fetch live</text><text x="1365" y="267" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">offer + live PayPal state</text><path d="M290,250 L340,250" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M590,250 L640,250" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M890,250 L940,250" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><path d="M1190,250 L1240,250" stroke="#0f1b17" stroke-width="2.5" fill="none" marker-end="url(#a-0f1b17)"/><rect x="1540" y="130" width="230" height="100" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="1.5"/><text x="1655" y="160" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#1f7a52" text-anchor="middle">CAPTURED</text><text x="1655" y="186" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">once · receipt written</text><rect x="1540" y="255" width="230" height="100" rx="14" fill="#fde8e5" stroke="#c0392b" stroke-width="1.5"/><text x="1655" y="285" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#c0392b" text-anchor="middle">VOIDED</text><text x="1655" y="311" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">hold released · $0 moved</text><rect x="1540" y="380" width="230" height="100" rx="14" fill="#fff1d6" stroke="#b86e00" stroke-width="1.5"/><text x="1655" y="410" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#b86e00" text-anchor="middle">REVIEW</text><text x="1655" y="436" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">uncertain: a human looks</text><path d="M1490,220 L1540,180" stroke="#1f7a52" stroke-width="2.5" fill="none" marker-end="url(#a-1f7a52)"/><path d="M1490,250 L1540,305" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#a-c0392b)"/><path d="M1490,280 L1540,430" stroke="#b86e00" stroke-width="2.5" fill="none" marker-end="url(#a-b86e00)"/><rect x="40" y="400" width="1470" height="300" rx="22" fill="#e4f3ea" stroke="#1f7a52" stroke-width="2" stroke-dasharray="8 6"/><text x="62" y="432" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1f7a52" text-anchor="start" letter-spacing="1.5">WHAT THE GATE CHECKS (every fact must pass; unknown is not a pass)</text><rect x="70" y="450" width="440" height="95" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="94" y="490" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Rules unchanged</text><text x="94" y="518" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">hash of approved rules</text><rect x="550" y="450" width="440" height="95" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="574" y="490" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Offer still matches</text><text x="574" y="518" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">price · stock · condition</text><rect x="1030" y="450" width="440" height="95" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="1054" y="490" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Total within budget</text><text x="1054" y="518" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">item + shipping + tax</text><rect x="70" y="570" width="440" height="95" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="94" y="610" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">PayPal hold valid</text><text x="94" y="638" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">amount, currency, status</text><rect x="550" y="570" width="440" height="95" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="1.5"/><text x="574" y="610" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0f1b17" text-anchor="start">Autonomy allows it</text><text x="574" y="638" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">agent key limit vs total</text><rect x="1030" y="570" width="440" height="95" rx="14" fill="#fff" stroke="#0866FF" stroke-width="3"/><text x="1054" y="610" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#0866FF" text-anchor="start">Inspection verdict</text><text x="1054" y="638" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#55635d" text-anchor="start">none · safe · blocked · unverified</text><path d="M1365,310 L1365,400" stroke="#1f7a52" stroke-width="2.5" fill="none" marker-end="url(#a-1f7a52)"/><rect x="40" y="730" width="1730" height="200" rx="20" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="70" y="770" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0866FF" text-anchor="start" letter-spacing="1.5">HOW THE INSPECTION VERDICT AFFECTS SETTLEMENT</text><rect x="70" y="795" width="395" height="110" rx="14" fill="#e4f3ea" stroke="#1f7a52" stroke-width="1.5"/><text x="90" y="835" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#1f7a52" text-anchor="start">SAFE_TO_PAY</text><text x="90" y="866" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#0f1b17" text-anchor="start">gate continues; other rules still apply</text><rect x="495" y="795" width="395" height="110" rx="14" fill="#fde8e5" stroke="#c0392b" stroke-width="1.5"/><text x="515" y="835" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#c0392b" text-anchor="start">DO_NOT_PAY</text><text x="515" y="866" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#0f1b17" text-anchor="start">gate blocks and voids the hold</text><rect x="920" y="795" width="395" height="110" rx="14" fill="#fff1d6" stroke="#b86e00" stroke-width="1.5"/><text x="940" y="835" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#b86e00" text-anchor="start">CANNOT_VERIFY</text><text x="940" y="866" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#0f1b17" text-anchor="start">gate blocks: unknown is never safe</text><rect x="1345" y="795" width="395" height="110" rx="14" fill="#eef1ef" stroke="#55635d" stroke-width="1.5"/><text x="1365" y="835" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#55635d" text-anchor="start">no inspection attached</text><text x="1365" y="866" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#0f1b17" text-anchor="start">other checks decide (unchanged)</text></svg>