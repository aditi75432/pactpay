services:
  db:
    image: postgres:16-alpine
    container_name: pactpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pactpay
      POSTGRES_USER: pactpay
      POSTGRES_PASSWORD: pactpay_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pactpay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactpay -d pactpay"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  pactpay_postgres_data:
