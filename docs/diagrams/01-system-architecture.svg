ited expiring agent key (ppk_)</text><rect x="1390" y="185" width="340" height="120" rx="14" fill="#ffffff" stroke="#cfd8d3" stroke-width="1.5"/><text x="1560" y="215" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Operator / reviewer</text><text x="1560" y="241" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">Control center (AG Grid)</text><text x="1560" y="262" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">receipts · audit chain · red-team</text><rect x="40" y="360" width="1720" height="280" rx="22" fill="#e6efff" stroke="#0866FF" stroke-width="2" stroke-dasharray="8 6"/><text x="62" y="392" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#0866FF" text-anchor="start" letter-spacing="1.5">2 · META MUSE LAYER  (probabilistic: reads, drafts, chooses tools. Never decides payment)</text><rect x="70" y="410" width="1650" height="55" rx="12" fill="#0e1a33" stroke="#0e1a33" stroke-width="1.5"/><text x="895" y="445" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">lib/llm-provider.ts: the single Meta model gateway (OpenAI-compatible chat completions, tools, json_schema, image_url, reasoning_effort)</text><rect x="70" y="485" width="400" height="130" rx="14" fill="#fff" stroke="#0866FF" stroke-width="1.5"/><text x="270" y="515" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0866FF" text-anchor="middle">Muse Spark 1.3 · Meta Model API</text><text x="270" y="541" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">api.meta.ai/v1 · muse-spark-1.3</text><text x="270" y="562" font-family="Inter,Segoe UI