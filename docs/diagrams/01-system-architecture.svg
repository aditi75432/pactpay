I,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">model text is data, never an order</text><rect x="40" y="670" width="1720" height="250" rx="22" fill="#e4f3ea" stroke="#1f7a52" stroke-width="2" stroke-dasharray="8 6"/><text x="62" y="702" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#1f7a52" text-anchor="start" letter-spacing="1.5">3 · PACTPAY CORE  (deterministic: pure TypeScript, no model in this zone)</text><rect x="70" y="715" width="270" height="175" rx="14" fill="#ffffff" stroke="#1f7a52" stroke-width="1.5"/><text x="205" y="745" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Policy engine</text><text x="205" y="771" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">typed rules → PASS / FAIL /</text><text x="205" y="792" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">UNKNOWN per condition</text><rect x="360" y="715" width="270" height="175" rx="14" fill="#ffffff" stroke="#1f7a52" stroke-width="1.5"/><text x="495" y="745" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1b17" text-anchor="middle">Checkout inspection</text><text x="495" y="771" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">2 readings must agree</text><text x="495" y="792" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#55635d" text-anchor="middle">arithmetic · injection scan</text><rect x="650" y="715" width="270" height="175" rx="14" fill="#fff" stroke="#1f7a52" stroke-width="3"/><text x="785" y="745" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800